    <style>
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        height: 100%;
        font-family: Arial, sans-serif;
        font-size: 0.875rem;
      }
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        height: 100dvh;
      }
      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        box-sizing: border-box;
        flex: 1;
        min-height: 0;
        height: 100%;
        padding: 12px;
        position: relative;
      }
      motion {
        display: block;
      }
      p {
        margin: 0 0 12px;
      }
      .home-status {
        margin: 0 0 12px;
      }
      .nav-tabs {
        margin-bottom: 12px;
        position: relative;
        z-index: 100;
        flex-shrink: 0;
        overflow: visible;
      }
      .country-loading-spinner {
        display: inline-block;
        width: 0.8rem;
        height: 0.8rem;
        border: 2px solid #c7d2fe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: country-spinner-spin 0.8s linear infinite;
      }
      .topic-loading-spinner {
        margin-left: auto;
      }
      @keyframes country-spinner-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .nav-tab-group {
        display: block;
        width: 100%;
        font-family: var(--sl-font-sans);
        font-size: var(--sl-font-size-medium);
        overflow: visible;
      }
      .nav-tab-group::part(base) {
        --indicator-color: var(--sl-color-primary-600);
        --track-color: var(--sl-color-neutral-200);
        --track-width: 1px;
      }
      .nav-tab-group::part(active-tab-indicator) {
        border-bottom-width: 3px;
      }
      .nav-tab-group sl-tab::part(base) {
        padding-top: calc(var(--sl-spacing-x-small) / 2);
        padding-bottom: calc(var(--sl-spacing-x-small) / 2);
        padding-left: 0.6rem;
        padding-right: 0.6rem;
      }
      .nav-tab-group::part(body) {
        display: none;
      }
      .nav-tab-group > sl-tab-panel {
        display: none !important;
      }
      .nav-home-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-home-icon {
        height: 1.1rem;
        width: auto;
        max-width: 4rem;
        object-fit: contain;
        flex-shrink: 0;
        display: block;
      }
      .nav-selection-indicators {
        margin-left: 0.3rem;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .nav-country-tab::part(base) {
        min-width: 2.4rem;
      }
      .nav-country-tab-icon {
        line-height: 1;
        font-size: 1rem;
      }
      .nav-update-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-pin-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-update-tab-content {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        max-width: min(22rem, 42vw);
      }
      .nav-pin-tab-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 1rem;
        line-height: 0;
      }
      .nav-update-icon {
        width: 1rem;
        height: 1rem;
        object-fit: contain;
        flex-shrink: 0;
      }
      .nav-groups-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-groups-icon {
        width: 1rem;
        height: 1rem;
        object-fit: contain;
        flex-shrink: 0;
        display: block;
      }
      .nav-pin-icon {
        width: 1.3rem;
        height: 1.3rem;
        object-fit: contain;
        flex-shrink: 0;
      }
      .nav-about-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-about-icon {
        width: 1rem;
        height: 1rem;
        object-fit: contain;
        flex-shrink: 0;
        display: block;
      }
      .nav-layers-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-layers-icon {
        width: 1rem;
        height: 1rem;
        object-fit: contain;
        flex-shrink: 0;
        display: block;
      }
      .nav-settings-tab::part(base) {
        min-width: 2.4rem;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
      .nav-settings-icon {
        width: 1rem;
        height: 1rem;
        object-fit: contain;
        flex-shrink: 0;
        display: block;
        opacity: 0.55;
      }
      .nav-settings-tab:hover .nav-settings-icon {
        opacity: 0.8;
      }
      .nav-toast {
        position: fixed;
        z-index: 10000;
        padding: 0.35rem 0.6rem;
        font-size: 0.78rem;
        line-height: 1.2;
        white-space: nowrap;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        pointer-events: none;
      }
      .nav-topic-tab::part(base) {
        min-width: 2.6rem;
      }
      .nav-topic-tab-icons {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .nav-topic-icon-wrap {
        display: inline-flex;
        align-items: center;
      }
      .nav-topic-icon {
        width: 0.95rem;
        height: 0.95rem;
        object-fit: contain;
      }
      .panel-hidden {
        display: none !important;
      }
      .panel-visible {
        display: block;
      }
      :root {
        --map-nav-bottom: 3.125rem;
        --map-top: var(--map-nav-bottom);
        --map-side: 12px;
        --map-bottom: 12px;
        --sidebar-width: 15rem;
        --sidebar-gap: 1rem;
      }
      .app[data-page="home"] .workspace,
      .app[data-page="country"] .workspace,
      .app[data-page="topic"] .workspace,
      .app[data-page="draw"] .workspace {
        height: 0;
        min-height: 0;
        overflow: visible;
      }
      .workspace {
        display: flex;
        align-items: stretch;
        gap: 1rem;
        position: relative;
        z-index: 1;
        min-height: 0;
        min-width: 0;
        overflow: auto;
      }
      .topic-sidebar-panel,
      .country-sidebar-panel {
        flex: 0 0 15rem;
        width: 15rem;
        min-width: 15rem;
        position: relative;
        z-index: 2;
        background: #fff;
      }
      .app[data-page="country"] .country-sidebar-panel,
      .app[data-page="topic"] .topic-sidebar-panel {
        position: fixed;
        top: var(--map-top);
        left: var(--map-side);
        bottom: var(--map-bottom);
        width: var(--sidebar-width);
        overflow-y: auto;
        z-index: 2;
      }
      .admin-sidebar-panel {
        flex: 0 0 18rem;
        width: 18rem;
        min-width: 18rem;
        position: relative;
        z-index: 2;
        background: #fff;
      }
      .admin-section {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .admin-field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .admin-label {
        font-size: 0.75rem;
        color: #4b5563;
      }
      .admin-input,
      .admin-select {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font: inherit;
      }
      .admin-input::placeholder {
        color: #9ca3af;
      }
      .admin-input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.4rem;
        align-items: center;
      }
      .admin-input-row--inline-label {
        grid-template-columns: auto auto;
        justify-content: start;
      }
      .admin-checkbox {
        width: auto;
        margin: 0;
      }
      .admin-ok {
        color: #16a34a;
        font-size: 0.9rem;
        font-weight: 700;
        line-height: 1;
      }
      .admin-actions {
        display: flex;
        gap: 0.5rem;
      }
      .admin-save {
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        font: inherit;
      }
      .admin-save:hover {
        background: #1d4ed8;
      }
      .admin-clear {
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #fff;
        color: #374151;
        padding: 0.45rem 0.8rem;
        cursor: pointer;
        font: inherit;
      }
      .admin-clear:hover {
        background: #f9fafb;
      }
      .admin-save:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .admin-error {
        margin: 0;
        color: #b91c1c;
      }
      .admin-message {
        margin: 0;
        color: #166534;
      }
      .admin-stored-value {
        margin-top: 0.15rem;
        color: #6b7280;
        font-size: 0.72rem;
        padding-left: 0.5rem;
      }
      .map-area {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }
      .app[data-page="home"] .map-area {
        position: fixed;
        top: var(--map-top);
        right: var(--map-side);
        bottom: var(--map-bottom);
        left: var(--map-side);
        z-index: 1;
      }
      .app[data-page="country"] .map-area,
      .app[data-page="topic"] .map-area,
      .app[data-page="draw"] .map-area {
        position: fixed;
        top: var(--map-top);
        right: var(--map-side);
        bottom: var(--map-bottom);
        left: calc(var(--map-side) + var(--sidebar-width) + var(--sidebar-gap));
        z-index: 1;
      }
      .maplibregl-ctrl-top-left .placesurfer-draw-ctrl {
        display: none;
      }
      .app[data-page="draw"] .maplibregl-ctrl-top-left .placesurfer-draw-ctrl {
        display: block;
      }
      .draw-layers-panel {
        display: none;
      }
      .app[data-page="draw"] .draw-layers-panel {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: var(--map-top);
        left: var(--map-side);
        bottom: var(--map-bottom);
        width: var(--sidebar-width);
        background: #fff;
        border-right: 1px solid #e5e7eb;
        overflow-y: auto;
        z-index: 2;
      }
      .draw-layer-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.25rem 0;
        min-height: 0;
      }
      .draw-layer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        border-bottom: 1px solid #f1f5f9;
        gap: 0.5rem;
      }
      .draw-layer-row.update-row:hover:not(.update-row--selected) {
        background: #f3f4f6;
      }
      .app[data-page="draw"] .draw-layer-row.update-row--selected {
        background: #c8e6c9;
        outline: 2px solid #43a047;
        outline-offset: -2px;
      }
      .draw-layer-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .draw-layer-delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      .draw-layer-delete-btn img {
        width: 14px;
        height: 14px;
        opacity: 0.5;
      }
      .draw-layer-delete-btn:hover img {
        opacity: 1;
      }
      .draw-layer-empty {
        padding: 0.75rem;
        color: #6b7280;
        font-size: 0.8rem;
        margin: 0;
      }
      .draw-layer-draft-row {
        display: flex;
        padding: 0.5rem;
        border-top: 1px solid #e5e7eb;
        gap: 0.25rem;
        flex-shrink: 0;
      }
      .map-area #map,
      .map-area .map-root {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100%;
        max-height: none;
        overflow: hidden;
      }
      .map-area .maplibregl-map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .map-area .maplibregl-canvas-container,
      .map-area .maplibregl-canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        z-index: 0;
      }
      .map-area .maplibregl-marker,
      .map-area .placesurfer-marker {
        z-index: 1;
      }
      .placesurfer-marker__visual.placesurfer-marker--row-hover,
      .placesurfer-marker__visual.placesurfer-marker--map-hover {
        transform: scale(1.3);
      }
      .map-status {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 2;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        color: #374151;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 4px;
        pointer-events: none;
      }
      .map-home-search {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        min-width: 10rem;
        max-width: 16rem;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 6px;
        padding: 0.2rem 0.4rem;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }
      .about-page {
        min-height: 40vh;
        font: inherit;
        color: #111827;
        line-height: 1.35;
        padding-left: 2ch;
      }
      .about-section {
        max-width: 36rem;
      }
      .about-heading {
        margin: 0 0 0.75rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
        line-height: 1.3;
      }
      .about-bio {
        margin: 0;
        line-height: 1.35;
        color: #111827;
      }
      .about-link,
      .about-bookmarklet {
        color: #2563eb;
        text-decoration: underline;
      }
      .about-link:hover,
      .about-bookmarklet:hover {
        color: #1d4ed8;
      }
      .about-sections {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .about-hemnet-steps {
        margin: 0;
        padding-left: 1.25rem;
        line-height: 1.35;
      }
      .about-hemnet-step + .about-hemnet-step {
        margin-top: 0.75rem;
      }
      .about-hemnet-steps code {
        font: inherit;
        background: #f3f4f6;
        padding: 0.1rem 0.3rem;
        border-radius: 4px;
      }
      .about-hint {
        margin: 0.35rem 0 0;
        font-size: 0.78rem;
        color: #6b7280;
        line-height: 1.2;
      }
      .about-menu-icon {
        width: 16px;
        height: 16px;
        vertical-align: text-bottom;
      }
      .about-sources-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        margin-top: 0.25rem;
      }
      .about-sources-table th,
      .about-sources-table td {
        border-bottom: 1px solid #f1f5f9;
        padding: 0.35rem 0.5rem;
        vertical-align: top;
        text-align: left;
      }
      .about-sources-table thead th {
        font-weight: inherit;
        color: #374151;
        background: #f8fafc;
      }
      .about-sources-icon-col {
        width: 2rem;
      }
      .about-source-icon {
        width: 1rem;
        height: 1rem;
        display: block;
      }
      .about-source-name {
        color: #111827;
      }
      .about-source-description {
        margin: 0;
        line-height: 1.35;
        color: #111827;
      }
      .settings-page {
        min-height: 40vh;
      }
      .settings-section {
        max-width: 36rem;
      }
      .settings-heading {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        color: #374151;
      }
      .settings-sections {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .settings-language-list {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .settings-language-row {
        display: grid;
        grid-template-columns: 1.5em 1fr;
        align-items: center;
        gap: 0.35rem 0.5rem;
        width: 100%;
        max-width: 16rem;
        box-sizing: border-box;
        padding: 0.35rem 0.45rem;
        border: none;
        border-radius: 4px;
        background: transparent;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .settings-language-row--selected {
        background: #e8f5e9;
      }
      .settings-language-flag {
        text-align: center;
        font-size: 1.1em;
        line-height: 1;
      }
      .settings-language-label {
        line-height: 1.3;
      }
      .topic-page {
        min-height: 40vh;
      }
      .topic-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .topic-empty-message {
        margin: 0.7rem 0 0.6rem;
        color: #b91c1c;
        font-size: 0.8rem;
        line-height: 1.35;
      }
      .topic-actions {
        margin-top: 0.75rem;
        display: flex;
      }
      .topic-show {
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        font: inherit;
      }
      .topic-show:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .topic-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.1rem 0;
        font-size: 0.8125rem;
      }
      .topic-row sl-checkbox::part(base) {
        font-size: var(--sl-font-size-x-small);
      }
      .topic-row-content {
        display: grid;
        grid-template-columns: 1.25em 1fr auto;
        align-items: center;
        column-gap: 0.35rem;
      }
      .topic-icon-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 1.25em;
      }
      .topic-icon {
        display: block;
        flex-shrink: 0;
        height: 1em;
        width: auto;
        object-fit: contain;
      }
      .topic-icon--art {
        width: 1em;
      }
      .topic-label {
        line-height: 1.3;
        text-align: left;
        justify-self: start;
      }
      .country-search {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 0.75rem;
        padding: 0.4rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font: inherit;
      }
      .country-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 0;
      }
      .country-list-message {
        margin: 0;
        padding: 0.35rem 0.45rem;
        color: #6b7280;
        font-size: 0.82rem;
      }
      .country-list-message--error {
        color: #b91c1c;
      }
      .country-row {
        display: grid;
        grid-template-columns: 1.5em 1fr;
        align-items: center;
        gap: 0.35rem 0.5rem;
        width: 100%;
        box-sizing: border-box;
        padding: 0.35rem 0.45rem;
        border: none;
        border-radius: 4px;
        background: transparent;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .country-row--selected {
        background: #e8f5e9;
      }
      .country-row--keyboard-focus {
        background: #dbeafe;
        outline: 2px solid #2563eb;
        outline-offset: -2px;
      }
      .country-flag {
        text-align: center;
        font-size: 1.1em;
        line-height: 1;
      }
      .country-label {
        line-height: 1.3;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .update-page {
        width: 100%;
        min-width: 0;
      }
      .pin-page {
        width: 100%;
        min-width: 0;
      }
      .groups-page {
        width: 100%;
        min-width: 0;
        flex: 1;
